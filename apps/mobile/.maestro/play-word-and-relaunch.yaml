# M2/M3 acceptance: fresh launch -> profile -> finish an item -> next -> kill -> relaunch.
appId: app.huroofi.dev
---
- launchApp:
    clearState: true
- tapOn:
    id: add-child-4-6
- tapOn:
    id: child-profile
- assertVisible:
    id: play-screen
- assertVisible:
    id: mascot
- runFlow: subflows/finish-current-item.yaml
- assertVisible:
    id: feedback
- tapOn:
    id: next
- assertVisible:
    id: progress
    text: '2 / .*'
- stopApp
- launchApp
- assertVisible:
    id: child-profile
