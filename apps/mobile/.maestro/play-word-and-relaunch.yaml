# M2 acceptance 7: fresh launch -> profile -> finish a word -> kill -> relaunch -> progress kept.
# The word is solved through the hint button so the flow doesn't depend on the seeded order.
appId: app.huroofi.dev
---
- launchApp:
    clearState: true
- tapOn:
    id: add-child-4-6
- tapOn:
    id: child-profile
- assertVisible:
    id: play-screen
- assertVisible:
    id: mascot
- repeat:
    times: 4 # longest seed word has 4 letters; extra hints on a full board do nothing
    commands:
      - tapOn:
          id: hint
      - tapOn:
          id: 'tile-.*-hinted'
          optional: true
- tapOn:
    id: check
- assertVisible:
    id: feedback
- assertVisible:
    id: next
- tapOn:
    id: next
- assertVisible:
    id: progress
    text: '2 / .*'
- stopApp
- launchApp
- assertVisible:
    id: child-profile
